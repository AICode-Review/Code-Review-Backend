name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    # Dummy, non-secret placeholders — src/config.ts's env() is parsed lazily and only
    # needs these six required fields to exist syntactically valid; the test suite never
    # hits real Supabase/GitHub (fakeSupabase.ts + fakeRouter.ts throughout), and
    # `npm run build` only type-compiles, it never executes env() at all. Verified locally
    # against this exact env shape before adding this workflow.
    env:
      NODE_ENV: test
      SUPABASE_URL: https://dummy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: dummy
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
      GITHUB_APP_ID: "1"
      GITHUB_PRIVATE_KEY: ZHVtbXk=
      GITHUB_WEBHOOK_SECRET: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database-reliability:
    name: PostgreSQL crash and concurrency checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: scrutinye_test_launch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      SUPABASE_URL: https://dummy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: dummy
      DATABASE_URL: postgresql://postgres:test-only@127.0.0.1:5432/scrutinye_test_launch
      LAUNCH_TEST_DATABASE_URL: postgresql://postgres:test-only@127.0.0.1:5432/scrutinye_test_launch
      GITHUB_APP_ID: "1"
      GITHUB_PRIVATE_KEY: ZHVtbXk=
      GITHUB_WEBHOOK_SECRET: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test -- --maxWorkers=1 src/db/launch.integration.test.ts

  # No-op (skipped, not failed) until RAILWAY_TOKEN exists in this repo's
  # Settings > Secrets and variables > Actions (Railway dashboard > Account Settings > Tokens).
  deploy:
    name: deploy (Railway)
    needs: [build, database-reliability]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Check for RAILWAY_TOKEN
        id: check
        run: echo "has_token=${{ secrets.RAILWAY_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.has_token == 'true'
        run: npx -y @railway/cli up --service backend --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
